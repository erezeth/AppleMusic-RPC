[package]
name = "apple-music-rpc"
version = "0.1.0"
description = "Apple Music playback as Discord Rich Presence"
authors = ["you"]
edition = "2021"

[lib]
name = "apple_music_rpc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
discord-rich-presence = "0.2"
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
